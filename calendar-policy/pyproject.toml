[project]
name = "hub-calendar-policy"
version = "0.1.0"
description = "Fail-closed policy layer for Personal AI Hub Calendar tools"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.12,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
